# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI-CD-Pipeline-Inspire-Offices

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Code ophalen uit repository
        uses: actions/checkout@v4

      - name: Controleer Docker Compose structuur
        run: docker compose config

      - name: Bouw de Docker Image (Fase 2 Validatie)
        run: docker compose build
      
      # Tussenstap: Zet de builder aan voor de push-actie
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: necatiemir/pipeline_inspire:latest
