# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI-CD-Pipeline-Inspire-Offices

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Code ophalen uit repository
        uses: actions/checkout@v4

      - name: Inloggen op Docker Hub
        # Dit is de actie die jouw Secrets gebruikt om veilig in te loggen
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Bouw en Push de Docker Image
        # Let op: vervang 'flask-reservations' door de exacte naam van jouw repository in Docker Hub!
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/flask-reservations:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/flask-reservations:latest
